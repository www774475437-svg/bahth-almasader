name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --org com.fawaid --project-name turath_finder .

      - name: Upload key (only if the secrets exist)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload.jks\n' "$KEYSTORE_PASS" "$KEYSTORE_PASS" > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Android (name, icon, sharing, font)
        run: python3 tool/patch_android.py

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/bahth-almasader.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/bahth-almasader-old-phones.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: turath-finder-apk
          path: out/bahth-almasader.apk

      - name: Publish download (release "latest")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest out/bahth-almasader.apk out/bahth-almasader-old-phones.apk --title "بحث المصادر $VER" --notes "الإصدار $VER" --latest

      - name: Store bundle (AAB)
        if: steps.key.outputs.signed == 'true'
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: store-bundle-aab
          path: build/app/outputs/bundle/release/app-release.aab
